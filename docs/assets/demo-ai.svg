t · ~/my-shop</text><g class="anim a0"><text x="36" y="70" fill="#9aa6aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">You</text></g><g class="anim a1"><rect width="852" height="66" x="24" y="80" fill="#1b2a30" rx="10"/></g><g class="anim a3"><text x="36" y="106" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" xml:space="preserve">Build me a small online shop with a storefront and an orders API,</text><clipPath id="kc2"><rect width="840" height="22.5" x="34" y="89.7"/></clipPath><g clip-path="url(#kc2)"><g class="cover c2"><rect width="645.6" height="22.5" x="35" y="89.7" fill="#1b2a30"/><rect width="9.5" height="22.5" x="36" y="89.7" fill="#61f0d3" opacity=".85"/></g></g></g><g class="anim a5"><text x="36" y="131" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" xml:space="preserve">and run it on my laptop.</text><clipPath id="kc4"><rect width="840" height="22.5" x="34" y="114.7"/></clipPath><g clip-path="url(#kc4)"><g class="cover c4"><rect width="257.9" height="22.5" x="35" y="114.7" fill="#1b2a30"/><rect width="9.5" height="22.5" x="36" y="114.7" fill="#61f0d3" opacity=".85"/></g></g></g><g class="anim a6"><circle cx="40" cy="180" r="4" fill="#61f0d3"/><text x="52" y="184.5" fill="#61f0d3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Agent</text></g><g class="anim a7"><text x="36" y="212" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">On it. I&apos;ll use Flisk to set up and run everything.</text></g><g class="anim a8"><text x="58" y="250" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Create the project</text><text x="330" y="250" fill="#62737a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">flisk project --yes</text></g><g class="anim a9 transient"><circle cx="42" cy="245" r="6" fill="none" stroke="#62737a" stroke-width="1.5"/></g><g class="anim a10"><circle cx="42" cy="245" r="7" fill="#61f0d3"/><path fill="none" stroke="#0c1417" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M38.5 245 l2.5 2.5 l4.5 -5"/></g><g class="anim a11"><text x="58" y="280" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Add the orders API</text><text x="330" y="280" fill="#62737a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">flisk resource orders-api --type backend --stack shop --yes</text></g><g class="anim a12 transient"><circle cx="42" cy="275" r="6" fill="none" stroke="#62737a" stroke-width="1.5"/></g><g class="anim a13"><circle cx="42" cy="275" r="7" fill="#61f0d3"/><path fill="none" stroke="#0c1417" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M38.5 275 l2.5 2.5 l4.5 -5"/></g><g class="anim a14"><text x="58" y="310" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Add the storefront</text><text x="330" y="310" fill="#62737a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">flisk resource shop-web --type frontend --stack shop --yes</text></g><g class="anim a15 transient"><circle cx="42" cy="305" r="6" fill="none" stroke="#62737a" stroke-width="1.5"/></g><g class="anim a16"><circle cx="42" cy="305" r="7" fill="#61f0d3"/><path fill="none" stroke="#0c1417" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M38.5 305 l2.5 2.5 l4.5 -5"/></g><g class="anim a17"><text x="58" y="340" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Start everything</text><text x="330" y="340" fill="#62737a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">flisk up shop</text></g><g class="anim a18 transient"><circle cx="42" cy="335" r="6" fill="none" stroke="#62737a" stroke-width="1.5"/></g><g class="anim a19"><circle cx="42" cy="335" r="7" fill="#61f0d3"/><path fill="none" stroke="#0c1417" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M38.5 335 l2.5 2.5 l4.5 -5"/></g><g class="anim a20"><text x="36" y="392" fill="#f4f7f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Flisk prints where your shop will be on your computer:</text></g><g class="anim a21"><rect width="852" height="78" x="24" y="406" fill="#1b2a30" rx="10"/></g><g class="anim a22"><text x="36" y="437" fill="#9aa6aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Storefront health</text><text x="180" y="437" fill="#61f0d3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" xml:space="preserve">http://app.my-shop.localhost/shop-web/health</text></g><g class="anim a23"><text x="36" y="467" fill="#9aa6aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Orders API health</text><text x="180" y="467" fill="#61f0d3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" xml:space="preserve">http://api.my-shop.localhost/api/orders/health</text></g><g class="anim a24"><text x="36" y="516" fill="#9aa6aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">I didn&apos;t write any Docker, server, or routing setup. Flisk did that part.</text></g></svg>