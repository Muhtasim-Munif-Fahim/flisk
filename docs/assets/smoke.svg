<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d" role="img" viewBox="0 0 600 628"><title id="t">flisk up smoke check</title><desc id="d">Animated: the smoke block runs through Traefik on the printed URL. Loop one passes (201 then 200). Loop two fails (404) and flisk up exits 1.</desc><style>@keyframes l1{0%,1.812%,49.688%,51.813%,99.688%{opacity:0}3.438%,48.125%,53.438%,98.125%{opacity:1}}@keyframes l2{0%,49.688%,58.063%,8.062%,99.688%{opacity:0}48.125%,59.688%,9.688%,98.125%{opacity:1}}@keyframes l3{0%,15.563%,49.688%,65.562%,99.688%{opacity:0}17.188%,48.125%,67.188%,98.125%{opacity:1}}@keyframes l4{0%,23.063%,49.688%,73.062%,99.688%{opacity:0}24.688%,48.125%,74.688%,98.125%{opacity:1}}@keyframes l5ok{0%,30.563%,49.688%{opacity:0}32.188%,48.125%{opacity:1}}@keyframes l5bad{0%,80.562%,99.688%{opacity:0}82.188%,98.125%{opacity:1}}@keyframes r6ok{0%,37.438%,49.688%{opacity:0}39.062%,48.125%{opacity:1}}@keyframes r6bad{0%,87.438%,99.688%{opacity:0}89.062%,98.125%{opacity:1}}@keyframes p1{0%,1.812%,49.688%,51.813%,99.688%{opacity:0}3.438%,48.125%,53.438%,98.125%{opacity:1}}@keyframes lab1{0%,50.938%{opacity:0}1.562%,49.375%{opacity:1}}@keyframes lab2{0%,100.937%,49.938%{opacity:0}51.562%,99.375%{opacity:1}}.l1{animation:l1 16s linear infinite;opacity:0}.l2{animation:l2 16s linear infinite}.l2,.l3,.l4{opacity:0}.l3{animation:l3 16s linear infinite}.l4{animation:l4 16s linear infinite}.l5bad,.l5ok{opacity:0}.l5ok{animation:l5ok 16s linear infinite}.l5bad{animation:l5bad 16s linear infinite}.r6bad,.r6ok{opacity:0}.r6ok{animation:r6ok 16s linear infinite}.r6bad{animation:r6bad 16s linear infinite}.lab1,.lab2{animation:lab1 16s linear infinite;opacity:0}.lab2{animation:lab2 16s linear infinite}text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dim{fill:#1b2330;stroke:#334155}.t{fill:#94a3b8;font-size:15px}.s{fill:#64748b;font-size:12px}.badb,.lit,.okb{stroke-width:2}.lit{fill:#10233a;stroke:#38bdf8}.okb{fill:#0c2a1c;stroke:#22c55e}.badb{fill:#32121a;stroke:#ef4444}.g,.r,.tw{font-size:15px}.tw{fill:#e2e8f0}.g{fill:#4ade80}.r{fill:#f87171}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><rect width="100%" height="100%" fill="#0b1220" rx="12"/><text x="40" y="44" class="tw" font-size="18" style="font-size:18px">flisk up: smoke check through the public URL</text><g class="lab1"><text x="40" y="76" class="g">loop 1 · the route works</text></g><g class="lab2"><text x="40" y="76" class="r">loop 2 · GET read-back returns 404</text></g><text x="40" y="98" class="s">not the container /health: the request goes to the URL flisk up prints</text><rect width="520" height="56" x="40" y="120" class="dim" rx="8"/><g class="l1"><rect width="520" height="56" x="40" y="120" class="lit" rx="8"/></g><text x="56" y="144" class="tw">1. service.json</text><text x="56" y="164" class="t">&quot;smoke&quot;: { via: proxy }</text><text x="296" y="192" class="s">↓</text><rect width="520" height="56" x="40" y="198" class="dim" rx="8"/><g class="l2"><rect width="520" height="56" x="40" y="198" class="lit" rx="8"/></g><text x="56" y="222" class="tw">2. flisk up</text><text x="56" y="242" class="t">starts the stack</text><text x="296" y="270" class="s">↓</text><rect width="520" height="56" x="40" y="276" class="dim" rx="8"/><g class="l3"><rect width="520" height="56" x="40" y="276" class="lit" rx="8"/></g><text x="56" y="300" class="tw">3. Traefik</text><text x="56" y="320" class="t">http://api.shop.localhost/api/orders</text><text x="296" y="348" class="s">↓</text><rect width="520" height="56" x="40" y="354" class="dim" rx="8"/><g class="l4"><rect width="520" height="56" x="40" y="354" class="lit" rx="8"/></g><text x="56" y="378" class="tw">4. POST /records</text><text x="56" y="398" class="t">201 → save $.id</text><text x="296" y="426" class="s">↓</text><rect width="520" height="56" x="40" y="432" class="dim" rx="8"/><g class="l5ok"><rect width="520" height="56" x="40" y="432" class="okb" rx="8"/></g><g class="l5bad"><rect width="520" height="56" x="40" y="432" class="badb" rx="8"/></g><text x="56" y="456" class="tw">5. GET /records/{{id}}</text><g class="l5ok"><text x="56" y="476" class="g">200 · body contains &quot;smoke&quot;</text></g><g class="l5bad"><text x="56" y="476" class="r">404 · expected 200</text></g><text x="296" y="504" class="s">↓</text><rect width="520" height="56" x="40" y="510" class="dim" rx="8"/><g class="r6ok"><rect width="520" height="56" x="40" y="510" class="okb" rx="8"/><text x="56" y="544" class="g" style="font-size:17px">✓ Smoke check passed</text></g><g class="r6bad"><rect width="520" height="56" x="40" y="510" class="badb" rx="8"/><text x="56" y="534" class="r" style="font-size:17px">✗ Smoke check failed</text><text x="56" y="554" class="r">flisk up exits 1</text></g></svg>